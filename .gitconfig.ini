[core]
	######   For Windows   ######
	;sshCommand = 'C:\\windows\\System32\\OpenSSH\\ssh.exe'
	;editor = 'code' --wait
	;autocrlf = true
	######   For Msys2   ######
	;sshCommand = '/c/msys64/usr/bin/ssh.exe'
	;editor = '/c/Users/USER/AppData/Local/Programs/Microsoft VS Code/bin/code' --wait
	;autocrlf = true
	######   For WSL   ######
	;sshCommand = /usr/bin/ssh
	;editor = 'code' --wait
	;autocrlf = input
	######   For Linux   ######
	;sshCommand = /usr/bin/ssh
	;editor = ''
	;autocrlf = input
	######   For Mac   ######
	;sshCommand = /usr/bin/ssh
	;editor = ''
	;autocrlf = input
	######   For BSD   ######
	;sshCommand = /usr/bin/ssh
	;editor = ''
	;autocrlf = input
[alias]
	br = branch
	brsc = branch --show-current
	cf = config
	cfg = config --global
	ck = "!fnc() { if [ \"$#\" -gt 1 ]; then git co \"$@\"; elif [ \"$#\" -eq 0 ]; then git co; else arg=\"$1\"; cwb=\"$(git brsc)\"; if [ \"$cwb\" != \"$arg\" ]; then git co -q \"$arg\" && printf \"Switched to branch '%s'\\n\" \"$arg\" && git st; else printf \"Already on '%s'\\n\" \"$cwb\"; fi; fi; }; fnc"
	co = checkout
	cm = commit -m
	pick = cherry-pick
	df = diff HEAD
	udf = diff
	sdf = diff --staged
	graph = log --graph --decorate --full-diff --stat --patch
	lg = log --oneline --decorate
	mgff = merge --ff-only
	mg = merge
	pl = pull
	ps = push
	rb = rebase
	rbff = rebase --ff-only
	rs = reset
	st = "!fnc() { if [ \"$#\" -gt 0 ]; then git status \"$@\"; else git status -s && if [ -e $GIT_DIR/logs/refs/stash ]; then stls=$(e=0; while IFS= read -r ln || [ -n \"$line\" ]; do e=$((e + 1)); done < $GIT_DIR/logs/refs/stash; echo $e); printf \"$: $stls\\n\"; fi; fi; }; fnc"
	stat = status
	sw = "!fnc() { if [ \"$#\" -gt 1 ]; then git swc \"$@\"; elif [ \"$#\" -eq 0 ]; then git swc; else arg=\"$1\"; cwb=\"$(git brsc)\"; if [ \"$cwb\" != \"$arg\" ]; then git swc -q \"$arg\" && printf \"Switched to branch '%s'\\n\" \"$arg\" && git st; else printf \"Already on '%s'\\n\" \"$cwb\"; fi; fi; }; fnc"
	swc = switch
	unstage = reset
[status]
	branch = true
	showUntrackedFiles = normal
	relativePaths = true
	aheadBehind = true
	showStash = true
	renames = true
	submoduleSummary = false
[filter "lfs"]
	smudge = git-lfs smudge -- %f
	process = git-lfs filter-process
	required = true
	clean = git-lfs clean -- %f
[user]
	name = Church1776
	email = brassmajor@gmail.com
[init]
	defaultBranch = master
[log]
	